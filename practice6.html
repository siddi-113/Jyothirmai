  <!DOCTYPE html>

<html>

<head>

<title>Registration form</title>
 
</head>

<body>

<h2 style="color:red">Registration Form</h2>

<form>

<label for="User name"> User name:</label>

<input type="text" id="user name" placeholder="user name">

<br> </br>

<label for="password">password:</label>
                
<input type="password" id="password" placeholder="password"  required>

<br> </br>

<label for="date">Date of birth:</label>

<input type="date" id="date">
<br> </br>

<label for="Gender">Gender:</label>

<input type="radio" name="gender"

value="female"> female 

<input type="radio" name="gender"

value="male"> male <br>

<br> </br>

<label for="Hobby">Hobby:</label>

<input type="checkbox" name="hobby"

value="reading"> Reading 

<input type="checkbox" name="hobby"

value="music">Music <br>

<br> </br>

<label for="Time">select time:</label>

<input type="time" id="Time">

<br></br>

<label for="email">Email:</label>

<input type="email" id="email" placeholder="email">

<br></br>

<label for="phone">Phone Number:</label>

<input type="tel" id="phone" placeholder="phone number">

<br></br>

<div style="background-color:skyblue;text-align:center">

<button style="color:red;background-color:skyblue">Register</button>

</div>

</form>

</body>

</html>
